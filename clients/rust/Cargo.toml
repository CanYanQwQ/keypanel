[package]
name = "cardkey-api-client-example"
version = "0.1.0"
edition = "2021"
description = "Independent CardKey API v1 Rust client example"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = true, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
