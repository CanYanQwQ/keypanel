[project]
name = "cardkey-api-client-example"
version = "0.1.0"
description = "Independent CardKey API v1 Python client example"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "cryptography>=42,<47",
]

[project.scripts]
cardkey-example = "cardkey_client.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
